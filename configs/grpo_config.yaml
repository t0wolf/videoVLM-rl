# GRPO 训练配置 - 双卡 RTX 4090

model:
  name: "./output/sft"

grpo:
  num_generations: 4
  max_completion_length: 256
  temperature: 0.7
  top_p: 0.9
  beta: 0.04

rewards:
  accuracy_weight: 0.5
  format_weight: 0.2
  length_weight: 0.15
  diversity_weight: 0.15

training:
  output_dir: "./output/grpo"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  bf16: true
  logging_steps: 5
  save_strategy: "epoch"
  save_total_limit: 1
  dataloader_num_workers: 4
  gradient_checkpointing: true
  deepspeed: "configs/ds_config_zero3.json"

data:
  grpo_file: "./data/grpo_train.jsonl"
  max_samples: 1000
