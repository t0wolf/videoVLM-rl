# DPO 训练配置 - 双卡 RTX 4090

model:
  policy_name: "./output/sft"
  ref_name: "./ckpts/Qwen3-VL-8B-Instruct"
  torch_dtype: "bfloat16"

dpo:
  beta: 0.1
  loss_type: "sigmoid"
  max_length: 2048
  max_prompt_length: 1024

training:
  output_dir: "./output/dpo"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 5.0e-6
  lr_scheduler_type: "cosine"
  bf16: true
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 1
  dataloader_num_workers: 4
  gradient_checkpointing: true
  deepspeed: "configs/ds_config_zero3.json"

data:
  preference_file: "./data/dpo_preference_data.jsonl"
