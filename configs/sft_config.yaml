# SFT 训练配置 - 双卡 RTX 4090 优化版

model:
  name: "./ckpts/Qwen3-VL-8B-Instruct"
  torch_dtype: "bfloat16"
  device_map: "auto"

lora:
  r: 32
  lora_alpha: 64
  target_modules: "all-linear"
  lora_dropout: 0.05

training:
  output_dir: "./output/sft"
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  bf16: true
  max_length: 2048
  logging_steps: 10
  save_strategy: "epoch"
  save_total_limit: 1
  dataloader_num_workers: 4
  gradient_checkpointing: true
  deepspeed: "configs/ds_config_zero2.json"

data:
  max_samples: 5000
  num_frames: 8
  sft_file: "./data/sft_train.jsonl"
