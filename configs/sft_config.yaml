data:
  dataset_name: lmms-lab/VideoChatGPT
  max_samples: 5000
  num_frames: 8
  sft_file: ./data/sft_train.jsonl
  video_dir: ./data/videos
lora:
  lora_alpha: 64
  lora_dropout: 0.05
  r: 32
  target_modules: all-linear
model:
  device_map: auto
  name: ./ckpts/Qwen3-VL-8B-Instruct
  torch_dtype: bfloat16
training:
  bf16: true
  dataloader_num_workers: 4
  deepspeed: configs/ds_config_zero2.json
  gradient_accumulation_steps: 2
  gradient_checkpointing: true
  learning_rate: 2.0e-05
  logging_steps: 10
  lr_scheduler_type: cosine
  max_length: 2048
  num_train_epochs: 1
  output_dir: ./output/sft
  per_device_train_batch_size: 2
  save_strategy: epoch
  save_total_limit: 1
  warmup_ratio: 0.03
